<!DOCTYPE html>
<html>
  <!-- headタグの中にはメタデータ等を記載する -->
  <head>
    <meta charset="utf-8" />
    <title>第三次しりとり対戦</title>
    <!-- reset.css destyle -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/destyle.css@1.0.15/destyle.css"
    />
    <link rel="stylesheet" href="index.css" />
  </head>

  <!-- bodyタグの中には実際に表示するものなどを書く -->
  <body>
    <header>
      <div>第三次しりとり対戦</div>
    </header>
    <main>
      <div class="wrapper">
        <div class="title">ルール</div>
        <ul>
          <li>普通のしりとりだよ</li>
          <li>対戦相手を敗北に追い詰めよう！！</li>
        </ul>
        <div class="title">このゲームの敗北条件</div>
        <ul class="rule-boxs">
          <li>回答時間の時間切れ(30秒)</li>
          <li>末尾が「ん」で終わる単語が入力する</li>
          <li>過去に使用した単語を入力する</li>
        </ul>
      </div>
      <a href="/shiritori" class="start-btn">対戦部屋へ</a>
    </main>
    <footer></footer>
    <script>
      window.onload = async (event) => {
        // GET /shiritoriを実行
        const response = await fetch("/shiritori", { method: "GET" });
        // responseの中からレスポンスのテキストデータを取得
        const previousWord = await response.text();
        // id: previousWordのタグを取得
        const paragraph = document.querySelector("#previousWord");
        // 取得したタグの中身を書き換える
        paragraph.innerHTML = `前の単語: ${previousWord}`;
      };

      // 送信ボタンの押下時に実行
      document.querySelector("#nextWordSendButton").onclick = async (event) => {
        // inputタグを取得
        const nextWordInput = document.querySelector("#nextWordInput");
        // inputの中身を取得
        const nextWordInputText = nextWordInput.value;
        // POST /shiritoriを実行
        // 次の単語をresponseに格納
        const response = await fetch("/shiritori", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nextWord: nextWordInputText }),
        });

        // status: 200以外が返ってきた場合にエラーを表示
        if (response.status !== 200) {
          const errorJson = await response.text();
          const errorObj = JSON.parse(errorJson);
          alert(errorObj["errorMessage"]);
        }

        const previousWord = await response.text();

        // id: previousWordのタグを取得
        const paragraph = document.querySelector("#previousWord");
        // 取得したタグの中身を書き換える
        paragraph.innerHTML = `前の単語: ${previousWord}`;
        // inputタグの中身を消去する
        nextWordInput.value = "";
      };
    </script>
  </body>
</html>
